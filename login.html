<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#052c68"><title>Connexion élève — Club de Solidarité ELARAKI</title><link rel="icon" href="assets/branding/club-solidarite-logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/account.css"></head>
<body class="account-page"><main class="account-shell narrow"><a href="index.html" class="back-link">← Retour au site</a>
<section class="account-card"><img class="account-logo" src="assets/branding/club-solidarite-logo.png" alt="Club de Solidarité">
<h1>Connexion</h1><p>Entrez votre adresse institutionnelle <strong>@elaraki.ac.ma</strong> et votre mot de passe.</p>
<div class="account-switch-tabs"><span>Se connecter</span><a href="register.html">Créer un compte</a></div>
<form id="studentLoginForm"><div class="account-fields single"><label>Adresse e-mail<input name="email" type="email" required autocomplete="username" placeholder="prenom.nom@elaraki.ac.ma"></label><label>Mot de passe<input name="password" type="password" required autocomplete="current-password"></label></div>
<button class="button button-primary" type="submit">Se connecter</button><p id="accountStatus" class="account-status" role="status"></p></form>
<p class="account-switch">Pas encore de compte ? <a href="register.html">Créer un compte</a></p></section></main>
<script src="assets/config.js"></script><script type="module" src="assets/public-auth.js"></script></body></html>
