<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#052c68"><title>Créer un compte — Club de Solidarité ELARAKI</title><link rel="icon" href="assets/branding/club-solidarite-logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/account.css"></head>
<body class="account-page"><main class="account-shell"><a href="index.html" class="back-link">← Retour au site</a>
<section class="account-card"><img class="account-logo" src="assets/branding/club-solidarite-logo.png" alt="Club de Solidarité">
<h1>Créer mon compte</h1><p>Inscription réservée aux élèves disposant d’une adresse <strong>@elaraki.ac.ma</strong>.</p>
<div class="account-switch-tabs"><a href="login.html">Se connecter</a><span>Créer un compte</span></div>
<form id="registerForm"><div class="account-fields"><label>Prénom *<input name="first_name" required maxlength="80" autocomplete="given-name"></label><label>Nom *<input name="last_name" required maxlength="80" autocomplete="family-name"></label><label>Adresse @elaraki.ac.ma *<input name="email" type="email" required placeholder="prenom.nom@elaraki.ac.ma" autocomplete="email"></label><label>Mot de passe *<input name="password" type="password" required minlength="8" autocomplete="new-password"></label><label>Niveau *<select name="grade_level" required><option value="">Choisir</option><option>Tronc Commun</option><option>1 Bac</option><option>2 Bac</option></select></label><label>Filière *<select name="track" required><option value="">Choisir le niveau d’abord</option></select></label><label>Numéro de classe *<input name="class_number" required maxlength="20" placeholder="Ex. 2"></label><label>Photo de profil (facultatif)<input name="avatar" type="file" accept="image/png,image/jpeg,image/webp"></label></div>
<p class="account-help">Photo : JPG, PNG ou WebP, 2 Mo maximum.</p>
<button class="button button-primary" type="submit">Créer mon compte</button><p id="accountStatus" class="account-status" role="status"></p></form>
<p class="account-switch">Déjà inscrit ? <a href="login.html">Se connecter</a></p></section></main>
<script src="assets/config.js"></script><script type="module" src="assets/public-auth.js"></script></body></html>
