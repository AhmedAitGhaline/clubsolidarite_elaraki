<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon profil — Club Solidarité</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/account.css"></head><body class="account-page"><main class="account-shell"><a href="index.html" class="back-link">← Retour au site</a><section class="account-card"><img class="account-logo" src="assets/branding/club-solidarite-logo.png" alt=""><h1>Mon profil élève</h1><p>Modifiez vos informations scolaires et ajoutez une photo de profil.</p><form id="profileForm"><div class="account-fields"><label>Prénom *<input name="first_name" required></label><label>Nom *<input name="last_name" required></label><label>Niveau *<select name="grade_level" required><option>Tronc Commun</option><option>1 Bac</option><option>2 Bac</option></select></label><label>Filière *<select name="track" required></select></label><label>Numéro de classe *<input name="class_number" required></label><label>Photo de profil<input name="avatar" type="file" accept="image/png,image/jpeg,image/webp"></label></div><div id="currentAvatar"></div><button class="button button-primary">Enregistrer mon profil</button><button class="button button-outline-dark" type="button" id="profileLogout">Se déconnecter</button><p id="profileStatus" class="account-status" role="status"></p></form></section></main><script src="assets/config.js"></script><script type="module" src="assets/profile.js"></script></body></html>
