<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compte élève — Club de Solidarité ELARAKI</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/account.css"></head>
<body class="account-page"><main class="account-shell"><a href="index.html" class="back-link">← Retour au site</a><section class="account-card"><img class="account-logo" src="assets/branding/club-solidarite-logo.png" alt="Club de Solidarité"><h1>Créer mon compte élève</h1><p>Inscription réservée aux élèves disposant d’une adresse institutionnelle <strong>@elaraki.ac.ma</strong>.</p>
<div class="account-tabs"><span class="account-tab-active">Créer un compte</span><a href="login.html">Déjà inscrit ? Se connecter</a></div>
<form id="registerForm" data-mode="register"><h2 id="registerHeading">Informations de l’élève</h2><div class="account-fields"><label>Prénom *<input name="first_name" required maxlength="80" autocomplete="given-name"></label><label>Nom *<input name="last_name" required maxlength="80" autocomplete="family-name"></label><label>Adresse @elaraki.ac.ma *<input name="email" type="email" required placeholder="prenom.nom@elaraki.ac.ma" autocomplete="email"></label><label>Mot de passe *<input name="password" type="password" required minlength="8" autocomplete="new-password"></label><label>Niveau *<select name="grade_level" required><option value="">Choisir</option><option>Tronc Commun</option><option>1 Bac</option><option>2 Bac</option></select></label><label>Filière *<select name="track" required><option value="">Choisir le niveau d’abord</option></select></label><label>Numéro de classe *<input name="class_number" required maxlength="20" placeholder="Ex. 2"></label><label>Photo de profil (facultatif)<input name="avatar" type="file" accept="image/png,image/jpeg,image/webp"></label></div><p class="account-help">Pour la photo, utilisez une image JPG, PNG ou WebP de 2 Mo maximum.</p><button class="button button-primary" type="submit" id="registerSubmit">Créer mon compte →</button><p id="accountStatus" role="status"></p></form></section></main><script src="assets/config.js"></script><script type="module" src="assets/public-auth.js"></script></body></html>
